name: Publish disabled for reference fork

on:
  workflow_dispatch:

jobs:
  reference-only:
    name: Confirm publishing is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Verify provenance and safety boundaries
        run: node scripts/repository-policy.test.js

      - name: Explain status
        run: echo "This historical reference fork has no publishing workflow."
